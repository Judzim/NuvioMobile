name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx3072M
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore and write runtime properties
        run: |
          printf '%s' "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > nuvio-release.p12
          cat > local.properties <<EOF
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME=${{ secrets.SIMKL_APP_NAME }}
          SIMKL_REDIRECT_URI=${{ secrets.SIMKL_REDIRECT_URI }}
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          NUVIO_RELEASE_STORE_FILE=nuvio-release.p12
          NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          EOF
          # Remove lines whose secret was left empty so generated config falls back to defaults.
          sed -i '/^[A-Z_]*=$/d' local.properties
          ls -la nuvio-release.p12

      - name: Assemble release APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-judzim-release
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/full/release/*.apk
